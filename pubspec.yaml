name: xaneo
description: Xaneo Mobile v2 - Secure messaging app
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP & gRPC API
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  grpc: ^4.1.0
  protobuf: ^3.1.0
  fixnum: ^1.1.0
  logging: ^1.3.0




  # Secure Storage
  flutter_secure_storage: ^9.2.1

  # Local Storage (for non-sensitive data)
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0
  http: ^1.1.0


  # UI Components
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10

  # Localization (pinned by flutter_localizations)
  intl: ^0.20.2

  # Connectivity
  connectivity_plus: ^6.0.2

  # Animations
  animations: ^2.0.8

  # Form validation
  form_field_validator: ^1.1.0

  # Image picking and cropping
  image_picker: ^1.0.7
  # Client-side image resize/compression before sending as a chat photo
  image: ^4.3.0

  # Permissions
  permission_handler: ^11.3.0

  # URL Launcher
  url_launcher: ^6.2.5

  # Audio recording
  record: ^7.1.0

  # Audio playback (voice messages)
  # Biometric (optional - for future)
  local_auth: ^2.1.8
  font_awesome_flutter: ^11.0.0

  # Cryptography for XSEC-2 E2E encryption (pure Dart)
  cryptography: ^2.7.2
  x25519: ^0.1.1
  argon2: ^1.0.1
  drift: ^2.32.1
  sqlcipher_flutter_libs: ^0.7.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  web_socket_channel: ^3.0.1
  livekit_client: 2.3.1+hotfix.1
  flutter_webrtc: ^0.12.9
  lottie: ^3.3.3
  video_player: ^2.11.1
  chewie: ^1.13.1
  video_thumbnail: ^0.5.6
  just_audio: ^0.10.5
  camera: ^0.12.0+1
  mobile_scanner: ^7.4.0
  file_picker: ^11.0.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  flutter_callkit_incoming: ^3.1.3
  proximity_sensor: ^2.0.0
  audio_service: ^0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: ^2.32.1
  build_runner: ^2.13.1

dependency_overrides:
  camera_avfoundation:
    git:
      url: https://github.com/flutter/packages.git
      path: packages/camera/camera_avfoundation

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/animations/
    - assets/sounds/
    - assets/manifest.v1.json


  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
